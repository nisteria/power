# docker-compose.yml - Power Energy Orchestrator Full Stack

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: power-postgres
    environment:
      POSTGRES_USER: power
      POSTGRES_PASSWORD: ${DB_PASSWORD:-power_dev_password}
      POSTGRES_DB: power_energy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U power -d power_energy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - power-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: power-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - power-network

  # API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: power-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://power:${DB_PASSWORD:-power_dev_password}@postgres:5432/power_energy
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      EPEX_API_KEY: ${EPEX_API_KEY:-}
      # Netzbetreiber OAuth
      WIENER_NETZE_CLIENT_ID: ${WIENER_NETZE_CLIENT_ID:-}
      WIENER_NETZE_CLIENT_SECRET: ${WIENER_NETZE_CLIENT_SECRET:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - power-network

  # Frontend (Next.js)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: power-web
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - power-network

  # Worker (Background Jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: power-worker
    command: ["node", "dist/worker/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://power:${DB_PASSWORD:-power_dev_password}@postgres:5432/power_energy
      REDIS_URL: redis://redis:6379
      EPEX_API_KEY: ${EPEX_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - power-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: power-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
    networks:
      - power-network

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: power-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - power-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: power-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - power-network

  # ELK Stack for Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: power-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - power-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: power-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - power-network

networks:
  power-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_ssl:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
