# Power Worker GitHub Actions Workflow
name: Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/worker/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          cd apps/worker
          npm ci
          
      - name: Run tests
        run: |
          cd apps/worker
          npm test
          
      - name: Type check
        run: |
          cd apps/worker
          npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build worker
        run: |
          cd apps/worker
          npm ci
          npm run build
          
      - name: Build Docker image
        run: |
          docker build -f apps/worker/Dockerfile -t power-worker:${{ github.sha }} .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying worker to staging..."
          # Add deployment commands
          
  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying worker to production..."
          # Add deployment commands
